<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Janus-facing architecture — the gravity well</title>
<style>
  :root { color-scheme: light dark; }
  body { margin:0; background:#faf9f5; display:flex; justify-content:center; align-items:flex-start; padding:24px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  @media (prefers-color-scheme: dark) { body { background:#262624; } }
  svg { width:100%; max-width:680px; height:auto; }

  /* The scene is always deep space, so its type is always light. */
  .th { font-size:14px; font-weight:500; fill:#ECEBE6; }
  .ts { font-size:12px; font-weight:400; fill:#AEB4C0; }
  .star { fill:#DCE3F0; }

  @keyframes jfaOrbit  { to { transform: rotate(360deg); } }
  @keyframes jfaTwinkle{ 0%,100% { opacity:.85; } 50% { opacity:.22; } }
  .jfa-sat { transform-box: view-box; transform-origin: 290px 300px; }

  @media (prefers-reduced-motion: no-preference) {
    .jfa-sat { animation: jfaOrbit 22s linear infinite; }
    .tw { animation-name: jfaTwinkle; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
  }
</style>
</head>
<body>
<svg viewBox="0 0 680 584" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Janus-facing architecture as a gravity well</title>
<desc>The architecture drawn as a planet in deep space, lit from the upper left. A hot, luminous core — the specification, stewarded by NTARI — sits where the gravity well is deepest and no one escapes. Around it: an amber mantle (the protocol commons — sovereign compute, the witnessed ledger, the covenant, and mutual credit), a slate crust (the mortal front ends), and a soft blue atmosphere (the users, free to drift away). Arrows fall inward from space toward the core: gravity, which is the cost of leaving, rising with depth. A small body orbits the planet — the contest — which stays aloft only while it keeps moving.</desc>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrowSm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M2.5 2L8 5L2.5 8" fill="none" stroke="context-stroke" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>

  <radialGradient id="jfaSpace" cx="290" cy="280" r="430" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#101A30"/><stop offset="0.6" stop-color="#0A1124"/><stop offset="1" stop-color="#05070E"/>
  </radialGradient>
  <radialGradient id="jfaGlow" cx="290" cy="300" r="300" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#3B82F6" stop-opacity="0.22"/><stop offset="0.5" stop-color="#3B82F6" stop-opacity="0.07"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="jfaCore" cx="0.42" cy="0.4" r="0.62"><stop offset="0" stop-color="#FFE9A8"/><stop offset="0.45" stop-color="#F97316"/><stop offset="1" stop-color="#A8201A"/></radialGradient>
  <radialGradient id="jfaSheen" cx="0.36" cy="0.32" r="0.7"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.04"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
  <radialGradient id="jfaLight" cx="0.34" cy="0.30" r="0.75"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.26"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.05"/><stop offset="0.85" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
  <radialGradient id="jfaShade" cx="0.66" cy="0.72" r="0.85"><stop offset="0" stop-color="#000000" stop-opacity="0"/><stop offset="0.55" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000814" stop-opacity="0.55"/></radialGradient>

  <filter id="jfaBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
</defs>

<!-- deep-space panel -->
<rect x="4" y="4" width="672" height="576" rx="18" fill="url(#jfaSpace)" stroke="#FFFFFF" stroke-opacity="0.06"/>
<circle cx="290" cy="300" r="300" fill="url(#jfaGlow)"/>

<!-- stars -->
<g>
  <circle class="star" cx="60"  cy="70"  r="1.0" opacity="0.6"/>
  <circle class="star tw" cx="110" cy="46" r="0.9" opacity="0.5" style="animation-duration:4.5s;animation-delay:0.2s"/>
  <circle class="star" cx="168" cy="96"  r="1.2" opacity="0.8"/>
  <circle class="star" cx="225" cy="60"  r="0.7" opacity="0.45"/>
  <circle class="star tw" cx="360" cy="52" r="1.0" opacity="0.6" style="animation-duration:5.5s;animation-delay:1.1s"/>
  <circle class="star" cx="415" cy="92"  r="0.8" opacity="0.5"/>
  <circle class="star" cx="470" cy="64"  r="1.1" opacity="0.7"/>
  <circle class="star" cx="540" cy="108" r="0.9" opacity="0.55"/>
  <circle class="star tw" cx="600" cy="60" r="1.3" opacity="0.85" style="animation-duration:3.8s;animation-delay:0.6s"/>
  <circle class="star" cx="640" cy="110" r="0.8" opacity="0.5"/>
  <circle class="star" cx="645" cy="150" r="1.0" opacity="0.6"/>
  <circle class="star" cx="650" cy="200" r="0.7" opacity="0.4"/>
  <circle class="star" cx="300" cy="96"  r="0.7" opacity="0.4"/>
  <circle class="star" cx="40"  cy="170" r="1.0" opacity="0.6"/>
  <circle class="star tw" cx="70" cy="240" r="0.8" opacity="0.5" style="animation-duration:6s;animation-delay:2s"/>
  <circle class="star" cx="36"  cy="320" r="1.2" opacity="0.75"/>
  <circle class="star" cx="78"  cy="400" r="0.9" opacity="0.55"/>
  <circle class="star" cx="50"  cy="460" r="0.8" opacity="0.5"/>
  <circle class="star" cx="95"  cy="150" r="0.7" opacity="0.45"/>
  <circle class="star tw" cx="560" cy="470" r="1.0" opacity="0.6" style="animation-duration:5s;animation-delay:0.9s"/>
  <circle class="star" cx="620" cy="440" r="0.8" opacity="0.5"/>
  <circle class="star" cx="600" cy="505" r="0.9" opacity="0.55"/>
  <circle class="star" cx="520" cy="500" r="0.7" opacity="0.45"/>
</g>

<!-- atmosphere bloom behind the planet -->
<circle cx="290" cy="300" r="176" fill="#60A5FA" opacity="0.45" filter="url(#jfaBlur)"/>

<!-- shells -->
<circle cx="290" cy="300" r="192" fill="#60A5FA" opacity="0.10"/>
<circle cx="290" cy="300" r="175" fill="#60A5FA" opacity="0.32"/>
<circle cx="290" cy="300" r="135" fill="#64748B"/>
<circle cx="290" cy="300" r="95"  fill="#E08611"/>

<!-- sphere lighting -->
<circle cx="290" cy="300" r="175" fill="url(#jfaLight)"/>
<circle cx="290" cy="300" r="175" fill="url(#jfaShade)"/>

<!-- luminous core, on top -->
<circle cx="290" cy="300" r="50" fill="url(#jfaCore)"/>
<circle cx="290" cy="300" r="50" fill="url(#jfaSheen)"/>

<!-- gravity field: it falls inward from every side; deepest where the core burns -->
<g stroke="#93A9C8" stroke-width="1.5" stroke-linecap="round" opacity="0.5">
  <line x1="145" y1="445" x2="184" y2="406" marker-end="url(#arrowSm)"/>
  <line x1="112" y1="402" x2="160" y2="375" marker-end="url(#arrowSm)"/>
  <line x1="92"  y1="353" x2="145" y2="339" marker-end="url(#arrowSm)"/>
  <line x1="92"  y1="247" x2="145" y2="261" marker-end="url(#arrowSm)"/>
  <line x1="112" y1="198" x2="160" y2="225" marker-end="url(#arrowSm)"/>
  <line x1="145" y1="155" x2="184" y2="194" marker-end="url(#arrowSm)"/>
</g>
<line x1="100" y1="300" x2="210" y2="300" stroke="#E2E8F0" stroke-width="2.6" stroke-linecap="round" opacity="0.92" marker-end="url(#arrow)"/>

<!-- the contest: a body that holds orbit only while it moves -->
<circle cx="290" cy="300" r="210" fill="none" stroke="#14B8A6" stroke-width="1" stroke-dasharray="3 6" opacity="0.6"/>
<g class="jfa-sat">
  <circle cx="261" cy="92"  r="5"   fill="#2DD4BF" opacity="0.18"/>
  <circle cx="232" cy="98"  r="4"   fill="#2DD4BF" opacity="0.12"/>
  <circle cx="205" cy="108" r="3"   fill="#2DD4BF" opacity="0.08"/>
  <circle cx="290" cy="90"  r="13"  fill="#14B8A6" opacity="0.22"/>
  <circle cx="290" cy="90"  r="6.5" fill="#2DD4BF"/>
</g>

<!-- headings -->
<text class="th" x="290" y="26" text-anchor="middle">Janus-facing architecture — the gravity well</text>
<text class="ts" x="290" y="44" text-anchor="middle">the deeper the layer, the higher the cost of leaving</text>

<!-- legend -->
<rect x="506" y="176" width="12" height="12" rx="2" fill="#60A5FA"/>
<text class="th" x="524" y="186">Users</text>
<text class="ts" x="524" y="202">free to drift</text>
<rect x="506" y="249" width="12" height="12" rx="2" fill="#64748B"/>
<text class="th" x="524" y="259">Front ends</text>
<text class="ts" x="524" y="275">mortal, swappable</text>
<rect x="506" y="322" width="12" height="12" rx="2" fill="#E08611"/>
<text class="th" x="524" y="332">The commons</text>
<text class="ts" x="524" y="348">shared, portable</text>
<rect x="506" y="395" width="12" height="12" rx="2" fill="#F97316"/>
<text class="th" x="524" y="405">The core</text>
<text class="ts" x="524" y="421">no escape</text>

<text class="ts" x="40" y="520">Gravity is the cost of leaving — shallow at the surface, bottomless at the core. The arrows are that inward pull.</text>
<text class="ts" x="40" y="540">The orbiting body is the contest: aloft only while moving. Stop, and it falls into the core — the spec you contest but cannot exit.</text>
<text class="ts" x="40" y="560">The commons holds four shared layers: sovereign compute, the witnessed ledger, the covenant, and mutual credit.</text>
</svg>
</body>
</html>
